<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title description">
  <title id="title">Demo 1: Azure VNet peering</title>
  <desc id="description">Two Windows Server virtual machines in separate, non-overlapping Azure virtual networks cannot initially communicate. Create peering links in both directions and enable virtual network access. Once both links show Connected, ping the destination private IP through Run Command and inspect the automatically added peering route.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .white { fill: #ffffff; }
      .muted { fill: #52657a; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 16px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 20px; }
      .green { fill: #166534; }
      .red { fill: #b91c1c; }
    </style>
  </defs>
  <rect width="1400" height="1120" fill="#f1f5f9"/>
  <rect width="1400" height="150" fill="url(#header)"/>
  <text x="60" y="43" class="white label">AZ-104 / MODULE 05 / DEMO 1</text>
  <text x="60" y="92" class="white" font-size="40" font-weight="700">Connect two Azure virtual networks</text>
  <text x="60" y="127" class="white body">VNet peering enables direct private-IP connectivity over the Microsoft backbone.</text>

  <text x="60" y="192" class="label muted">REGIONAL PEERING / WEST EUROPE / NON-OVERLAPPING ADDRESS SPACES</text>
  <rect x="60" y="215" width="450" height="245" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="60" y="215" width="450" height="48" rx="18" fill="#dbeafe"/>
  <rect x="60" y="244" width="450" height="19" fill="#dbeafe"/>
  <text x="84" y="247" class="label">NETWORK A / vnet-a</text>
  <text x="84" y="302" class="mono">10.10.0.0/16</text>
  <text x="84" y="335" class="body muted">snet-demo: 10.10.1.0/24</text>
  <rect x="84" y="355" width="402" height="81" rx="10" fill="#eff6ff"/>
  <text x="104" y="387" class="body" font-weight="700">vm-a / Windows Server 2022</text>
  <text x="104" y="418" class="mono">10.10.1.4</text>

  <rect x="890" y="215" width="450" height="245" rx="18" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
  <rect x="890" y="215" width="450" height="48" rx="18" fill="#cffafe"/>
  <rect x="890" y="244" width="450" height="19" fill="#cffafe"/>
  <text x="914" y="247" class="label">NETWORK B / vnet-b</text>
  <text x="914" y="302" class="mono">10.20.0.0/16</text>
  <text x="914" y="335" class="body muted">snet-demo: 10.20.1.0/24</text>
  <rect x="914" y="355" width="402" height="81" rx="10" fill="#ecfeff"/>
  <text x="934" y="387" class="body" font-weight="700">vm-b / Windows Server 2022</text>
  <text x="934" y="418" class="mono">10.20.1.4</text>

  <text x="700" y="281" class="label green" text-anchor="middle">AFTER CONFIGURATION</text>
  <path d="M535 321 H865" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="700" y="310" class="small" text-anchor="middle">a-to-b</text>
  <path d="M865 374 H535" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="700" y="405" class="small" text-anchor="middle">b-to-a</text>
  <text x="700" y="441" class="body green" font-weight="700" text-anchor="middle">Both links: Connected</text>

  <rect x="60" y="490" width="620" height="145" rx="16" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="84" y="530" class="heading red">BEFORE: separate networks</text>
  <text x="84" y="568" class="body">Ping from vm-a to 10.20.1.4 receives no reply.</text>
  <text x="84" y="604" class="small red">There is no network path between the VNets.</text>
  <rect x="720" y="490" width="620" height="145" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="744" y="530" class="heading green">AFTER: two connected peering links</text>
  <text x="744" y="568" class="body">Repeat the same ping. Expect replies from vm-b.</text>
  <text x="744" y="604" class="small green">No VPN gateway, NVA, or custom route is needed.</text>

  <text x="60" y="680" class="label muted">CONFIGURE / TEST / VERIFY</text>
  <rect x="60" y="702" width="400" height="253" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="92" cy="736" r="18" fill="#2563eb"/>
  <text x="92" y="743" class="white body" text-anchor="middle" font-weight="700">1</text>
  <text x="122" y="743" class="heading">Create peering</text>
  <text x="84" y="786" class="body" font-weight="700">vnet-a &gt; Peerings &gt; Add</text>
  <text x="84" y="819" class="small">Remote network: vnet-b</text>
  <text x="84" y="849" class="small">Create links: a-to-b and b-to-a</text>
  <text x="84" y="879" class="small">Enable VNet access in both directions.</text>
  <text x="84" y="909" class="small">Leave forwarded traffic and gateway</text>
  <text x="84" y="932" class="small">options disabled for this demo.</text>

  <rect x="500" y="702" width="400" height="253" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="532" cy="736" r="18" fill="#0e7490"/>
  <text x="532" y="743" class="white body" text-anchor="middle" font-weight="700">2</text>
  <text x="562" y="743" class="heading">Test private IPs</text>
  <text x="524" y="786" class="body" font-weight="700">vm-a &gt; Run command</text>
  <text x="524" y="819" class="small">Select RunPowerShellScript.</text>
  <rect x="524" y="839" width="352" height="47" rx="8" fill="#e2e8f0"/>
  <text x="537" y="868" font-family="Consolas, monospace" font-size="15">ping.exe -n 4 -w 2000 10.20.1.4</text>
  <text x="524" y="914" class="small">Run before and after peering.</text>
  <text x="524" y="939" class="small">No RDP or SSH session is needed.</text>

  <rect x="940" y="702" width="400" height="253" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="972" cy="736" r="18" fill="#2563eb"/>
  <text x="972" y="743" class="white body" text-anchor="middle" font-weight="700">3</text>
  <text x="1002" y="743" class="heading">Inspect the route</text>
  <text x="964" y="786" class="body" font-weight="700">nic-vm-a &gt; Effective routes</text>
  <text x="964" y="824" class="mono">10.20.0.0/16</text>
  <text x="964" y="858" class="body">Next hop: VNet peering</text>
  <text x="964" y="896" class="small">Azure adds the route automatically.</text>
  <text x="964" y="926" class="small">NSGs and guest firewalls still matter.</text>

  <rect x="60" y="980" width="1280" height="100" rx="14" fill="#102a43"/>
  <text x="84" y="1015" class="white body" font-weight="700">LAB ONLY: Windows Firewall profiles are disabled by the deployment extension.</text>
  <text x="84" y="1046" class="white small">NSGs still block inbound Internet traffic. Check ping output, not just Run Command status.</text>
  <text x="84" y="1069" class="white small">Cleanup: delete only the dedicated demo resource group after checking its contents.</text>
  <text x="1340" y="1105" class="small muted" text-anchor="end">VNet peering is not transitive: a third network requires its own connectivity design.</text>
</svg>
